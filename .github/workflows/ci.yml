name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.2.0
      - run: npm ci
      - run: npm test
      - run: uv run --with-requirements pipeline/requirements.txt python -m unittest discover -s tests

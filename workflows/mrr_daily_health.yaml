# Cloud Scheduler starts this workflow with `{}` at 08:00 UTC.
# It proves that the prior UTC day's explicit window reached a valid two-source Gold snapshot.
main:
  params: [input]
  steps:
    - derive_window:
        assign:
          - window_start: ${text.substring(time.format(sys.now() - 86400, "UTC"), 0, 10) + "T00:00:00Z"}
    - build_query:
        assign:
          - gold_sql: ${"SELECT COUNT(*) FROM (SELECT run_id FROM `project-90394262-994e-4667-90d.mrr_gold.daily_source_metrics` WHERE window_start = TIMESTAMP('" + window_start + "') GROUP BY run_id HAVING COUNT(DISTINCT source) = 2 AND COUNTIF(source_status = 'succeeded') = 2)"}
          - enrichment_sql: ${"SELECT IF(COUNT(*) = 3 AND COUNTIF(status = 'failed') = 3, 3, 0) FROM (SELECT status FROM `project-90394262-994e-4667-90d.mrr_enrichment.enrichment_runs` ORDER BY finished_at DESC LIMIT 3)"}
          - sql: ${"SELECT (" + gold_sql + ") AS valid_run_count, (" + enrichment_sql + ") AS consecutive_enrichment_failures"}
    - query_gold:
        try:
          call: http.post
          args:
            url: https://bigquery.googleapis.com/bigquery/v2/projects/project-90394262-994e-4667-90d/queries
            auth:
              type: OAuth2
            headers:
              Content-Type: application/json
            body:
              query: ${sql}
              useLegacySql: false
              location: US
              maximumBytesBilled: "1073741824"
          result: query_result
        except:
          as: error
          steps:
            - log_query_failure:
                call: sys.log
                args:
                  severity: ERROR
                  text: ${"mrr_alert_type=missing_gold workflow=mrr-daily-health query_error=" + json.encode_to_string(error)}
            - fail_query:
                raise: ${error}
    - check_result:
        switch:
          - condition: ${int(query_result.body.rows[0].f[0].v) > 0}
            next: check_enrichment
    - log_missing_gold:
        call: sys.log
        args:
          severity: ERROR
          text: ${"mrr_alert_type=missing_gold workflow=mrr-daily-health window_start=" + window_start}
    - fail_missing_gold:
        raise: ${"No complete two-source official Gold run for " + window_start}
    - check_enrichment:
        switch:
          - condition: ${int(query_result.body.rows[0].f[1].v) == 3}
            next: log_enrichment_alert
    - healthy:
        return: ${query_result.body.rows[0].f[0].v}
    - log_enrichment_alert:
        call: sys.log
        args:
          severity: ERROR
          text: mrr_alert_type=enrichment_consecutive_failure workflow=mrr-daily-health consecutive_failures=3
    - enrichment_alerted:
        return: ${query_result.body.rows[0].f[0].v}
